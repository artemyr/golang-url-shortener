services:
  go-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    volumes:
      - ../config:/root/config
      - ../storage:/root/storage
    ports:
      - "8082:8082"

  go-dev:
    image: golang:1.25
    env_file: ../.env
    working_dir: /app
    volumes:
      - ..:/app
      - go-mod-cache:/go/pkg/mod
      - ../config:/root/config
      - ../storage:/root/storage
    ports:
      - "8082:8082"
    command: sh -c "go install github.com/air-verse/air@latest && air"


volumes:
  go-mod-cache: